<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WBJECA 2026 – Data Structures MCQ</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Mono:wght@400;500&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0a0f;
    --surface: #12121a;
    --card: #1a1a26;
    --border: #2a2a3a;
    --accent: #7c6fff;
    --accent2: #ff6f91;
    --accent3: #6fffd4;
    --gold: #ffd86e;
    --text: #e8e8f0;
    --muted: #8888a8;
    --correct: #4ade80;
    --wrong: #f87171;
    --tag-bg: #1e1e30;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* Background grid */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(124,111,255,0.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(124,111,255,0.04) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
    z-index: 0;
  }

  .hero {
    position: relative;
    z-index: 1;
    text-align: center;
    padding: 48px 24px 32px;
    background: linear-gradient(180deg, rgba(124,111,255,0.12) 0%, transparent 100%);
    border-bottom: 1px solid var(--border);
  }

  .hero-badge {
    display: inline-block;
    background: rgba(124,111,255,0.15);
    border: 1px solid rgba(124,111,255,0.3);
    color: var(--accent);
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    letter-spacing: 2px;
    padding: 6px 16px;
    border-radius: 100px;
    margin-bottom: 20px;
    text-transform: uppercase;
  }

  .hero h1 {
    font-family: 'Syne', sans-serif;
    font-size: clamp(28px, 5vw, 52px);
    font-weight: 800;
    line-height: 1.1;
    background: linear-gradient(135deg, #fff 30%, var(--accent) 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    margin-bottom: 12px;
  }

  .hero p {
    color: var(--muted);
    font-size: 15px;
    max-width: 500px;
    margin: 0 auto 28px;
  }

  /* Stats bar */
  .stats-bar {
    display: flex;
    justify-content: center;
    gap: 32px;
    flex-wrap: wrap;
    margin-top: 8px;
  }
  .stat { text-align: center; }
  .stat-num {
    font-family: 'Syne', sans-serif;
    font-size: 24px;
    font-weight: 800;
    color: var(--accent);
  }
  .stat-label { font-size: 11px; color: var(--muted); letter-spacing: 1px; text-transform: uppercase; }

  /* Filter tabs */
  .filter-section {
    position: relative;
    z-index: 1;
    padding: 20px 24px;
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    justify-content: center;
    border-bottom: 1px solid var(--border);
  }

  .filter-btn {
    background: var(--tag-bg);
    border: 1px solid var(--border);
    color: var(--muted);
    font-family: 'DM Mono', monospace;
    font-size: 12px;
    padding: 8px 16px;
    border-radius: 8px;
    cursor: pointer;
    transition: all 0.2s;
    letter-spacing: 0.5px;
  }
  .filter-btn:hover, .filter-btn.active {
    background: rgba(124,111,255,0.2);
    border-color: var(--accent);
    color: var(--accent);
  }

  /* Score tracker */
  .score-tracker {
    position: relative;
    z-index: 1;
    display: flex;
    justify-content: center;
    gap: 20px;
    padding: 16px 24px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    flex-wrap: wrap;
  }
  .score-item {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    color: var(--muted);
  }
  .score-dot { width: 10px; height: 10px; border-radius: 50%; }
  .score-dot.correct { background: var(--correct); }
  .score-dot.wrong { background: var(--wrong); }
  .score-dot.skip { background: var(--muted); }
  .score-count { font-family: 'DM Mono', monospace; color: var(--text); font-weight: 500; }

  /* MCQ container */
  .mcq-container {
    position: relative;
    z-index: 1;
    max-width: 860px;
    margin: 0 auto;
    padding: 28px 20px 60px;
    display: flex;
    flex-direction: column;
    gap: 24px;
  }

  .question-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    overflow: hidden;
    transition: border-color 0.3s;
    animation: fadeSlide 0.4s ease both;
  }
  .question-card:hover { border-color: rgba(124,111,255,0.3); }

  @keyframes fadeSlide {
    from { opacity: 0; transform: translateY(16px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .card-header {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 16px 20px 0;
    flex-wrap: wrap;
  }

  .q-number {
    font-family: 'DM Mono', monospace;
    font-size: 12px;
    color: var(--muted);
    background: rgba(255,255,255,0.05);
    padding: 3px 10px;
    border-radius: 6px;
  }

  .q-tag {
    font-size: 11px;
    font-family: 'DM Mono', monospace;
    letter-spacing: 0.5px;
    padding: 3px 10px;
    border-radius: 6px;
    text-transform: uppercase;
  }
  .tag-search   { background: rgba(111,255,212,0.12); color: var(--accent3); }
  .tag-sorting  { background: rgba(255,111,145,0.12); color: var(--accent2); }
  .tag-stack    { background: rgba(255,216,110,0.12); color: var(--gold); }
  .tag-queue    { background: rgba(124,111,255,0.15); color: var(--accent); }
  .tag-linked   { background: rgba(111,255,212,0.12); color: #6fffd4; }
  .tag-tree     { background: rgba(255,160,80,0.12); color: #ffa050; }
  .tag-graph    { background: rgba(180,111,255,0.12); color: #b46fff; }

  .q-year {
    margin-left: auto;
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    color: var(--muted);
    background: rgba(255,255,255,0.04);
    padding: 3px 10px;
    border-radius: 6px;
  }

  .q-text {
    padding: 16px 20px 14px;
    font-size: 15px;
    line-height: 1.65;
    font-weight: 400;
    color: var(--text);
  }
  .q-text code {
    font-family: 'DM Mono', monospace;
    font-size: 13px;
    background: rgba(255,255,255,0.07);
    padding: 2px 6px;
    border-radius: 4px;
    color: var(--accent3);
  }

  .options-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    padding: 0 20px 16px;
  }
  @media (max-width: 560px) {
    .options-grid { grid-template-columns: 1fr; }
  }

  .option-btn {
    background: rgba(255,255,255,0.04);
    border: 1px solid var(--border);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    font-size: 14px;
    padding: 12px 16px;
    border-radius: 10px;
    cursor: pointer;
    text-align: left;
    transition: all 0.18s;
    display: flex;
    align-items: center;
    gap: 10px;
    line-height: 1.4;
  }
  .option-btn:hover:not(:disabled) {
    background: rgba(124,111,255,0.12);
    border-color: var(--accent);
    color: #fff;
  }
  .option-btn .opt-label {
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    color: var(--muted);
    min-width: 18px;
  }
  .option-btn.correct-ans {
    background: rgba(74,222,128,0.12);
    border-color: var(--correct);
    color: var(--correct);
  }
  .option-btn.wrong-ans {
    background: rgba(248,113,113,0.12);
    border-color: var(--wrong);
    color: var(--wrong);
  }
  .option-btn.show-correct {
    background: rgba(74,222,128,0.07);
    border-color: rgba(74,222,128,0.4);
    color: var(--correct);
  }
  .option-btn:disabled { cursor: default; }

  /* Answer reveal */
  .answer-box {
    margin: 0 20px 20px;
    background: rgba(124,111,255,0.07);
    border: 1px solid rgba(124,111,255,0.2);
    border-radius: 12px;
    padding: 16px 18px;
    display: none;
    animation: fadeSlide 0.3s ease;
  }
  .answer-box.visible { display: block; }
  .answer-box .ans-header {
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    color: var(--accent);
    letter-spacing: 1px;
    text-transform: uppercase;
    margin-bottom: 8px;
  }
  .answer-box .ans-text {
    font-size: 13.5px;
    line-height: 1.65;
    color: #c8c8e0;
  }
  .answer-box .ans-text strong { color: var(--gold); }

  .show-ans-btn {
    display: block;
    margin: 0 20px 20px;
    background: transparent;
    border: 1px dashed var(--border);
    color: var(--muted);
    font-family: 'DM Mono', monospace;
    font-size: 12px;
    padding: 9px;
    border-radius: 8px;
    cursor: pointer;
    width: calc(100% - 40px);
    transition: all 0.2s;
    letter-spacing: 0.5px;
  }
  .show-ans-btn:hover {
    border-color: var(--accent);
    color: var(--accent);
  }

  /* Progress bar */
  .progress-wrap {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    z-index: 100;
    height: 4px;
    background: rgba(255,255,255,0.05);
  }
  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    transition: width 0.5s ease;
  }

  /* Reset btn */
  .reset-btn {
    display: block;
    margin: 0 auto 40px;
    background: rgba(124,111,255,0.15);
    border: 1px solid rgba(124,111,255,0.3);
    color: var(--accent);
    font-family: 'DM Mono', monospace;
    font-size: 13px;
    padding: 12px 32px;
    border-radius: 10px;
    cursor: pointer;
    transition: all 0.2s;
    letter-spacing: 0.5px;
  }
  .reset-btn:hover { background: rgba(124,111,255,0.25); }

  .hidden { display: none !important; }
</style>
</head>
<body>

<div class="hero">
  <div class="hero-badge">WBJECA 2022–2026 • Data Structures</div>
  <h1>50 Must-Know MCQs</h1>
  <p>Searching · Sorting · Stack · Queue · Linked List · Tree · Graph — in easy Class 7 language</p>
  <div class="stats-bar">
    <div class="stat"><div class="stat-num">50</div><div class="stat-label">Questions</div></div>
    <div class="stat"><div class="stat-num">7</div><div class="stat-label">Topics</div></div>
    <div class="stat"><div class="stat-num">PYQ</div><div class="stat-label">Based</div></div>
  </div>
</div>

<div class="filter-section">
  <button class="filter-btn active" onclick="filterQ('all', this)">All 50</button>
  <button class="filter-btn" onclick="filterQ('search', this)">🔍 Searching</button>
  <button class="filter-btn" onclick="filterQ('sorting', this)">📊 Sorting</button>
  <button class="filter-btn" onclick="filterQ('stack', this)">📦 Stack</button>
  <button class="filter-btn" onclick="filterQ('queue', this)">🚌 Queue</button>
  <button class="filter-btn" onclick="filterQ('linked', this)">🔗 Linked List</button>
  <button class="filter-btn" onclick="filterQ('tree', this)">🌳 Tree</button>
  <button class="filter-btn" onclick="filterQ('graph', this)">🕸 Graph</button>
</div>

<div class="score-tracker">
  <div class="score-item"><div class="score-dot correct"></div><span>Correct: <span class="score-count" id="score-correct">0</span></span></div>
  <div class="score-item"><div class="score-dot wrong"></div><span>Wrong: <span class="score-count" id="score-wrong">0</span></span></div>
  <div class="score-item"><div class="score-dot skip"></div><span>Attempted: <span class="score-count" id="score-total">0</span> / 50</span></div>
</div>

<div class="mcq-container" id="mcq-container"></div>

<button class="reset-btn" onclick="resetAll()">↺ Reset All Answers</button>

<div class="progress-wrap"><div class="progress-fill" id="progress-fill" style="width:0%"></div></div>

<script>
const questions = [
  // ── SEARCHING (Q1–Q8) ──
  {
    id:1, cat:'search', year:'2022',
    q:'What is the time complexity of Binary Search in the worst case?',
    opts:['O(n)','O(log n)','O(n²)','O(1)'],
    ans:1,
    exp:'Binary Search works like finding a page in a book by always opening the middle. Each step cuts the list in half, so worst case is <strong>O(log n)</strong>. Linear search would be O(n) — checking every item one by one.'
  },
  {
    id:2, cat:'search', year:'2023',
    q:'Binary Search can only be applied when the array is:',
    opts:['Unsorted','Sorted','Has no duplicates','Has even number of elements'],
    ans:1,
    exp:'Binary Search works by comparing the middle element. If the array is NOT sorted, you can\'t decide which half to look in. So it <strong>must be sorted</strong> first. Think of a dictionary — it works because words are in order!'
  },
  {
    id:3, cat:'search', year:'2024',
    q:'How many comparisons are needed (worst case) to search an element in a sorted list of 64 elements using Binary Search?',
    opts:['6','7','8','64'],
    ans:0,
    exp:'log₂(64) = 6. Every time we compare, the list gets halved: 64→32→16→8→4→2→1. That\'s exactly <strong>6 steps</strong>. Remember: log₂(2ⁿ) = n.'
  },
  {
    id:4, cat:'search', year:'2022',
    q:'Which searching algorithm has O(1) best-case time complexity?',
    opts:['Binary Search','Linear Search','Both A and B','Neither'],
    ans:2,
    exp:'Both have O(1) best case! In <strong>Linear Search</strong>, if the first element is what you want — done in 1 step! In <strong>Binary Search</strong>, if the middle element is the target — also done in 1 step!'
  },
  {
    id:5, cat:'search', year:'2025',
    q:'What is the average case time complexity of Linear Search?',
    opts:['O(1)','O(log n)','O(n)','O(n log n)'],
    ans:2,
    exp:'In Linear Search, on average you need to check about n/2 elements. But we drop constants in Big-O, so it\'s <strong>O(n)</strong>. Like searching your lost eraser by checking every pocket one by one!'
  },
  {
    id:6, cat:'search', year:'2024',
    q:'Interpolation Search works best when data is:',
    opts:['Randomly distributed','Uniformly distributed','Sorted in reverse','Linked'],
    ans:1,
    exp:'Interpolation Search is like a smarter Binary Search. It guesses WHERE the element might be (like how you open a phone book near "S" for "Singh"). It works best when data is <strong>uniformly distributed</strong> — evenly spread out.'
  },
  {
    id:7, cat:'search', year:'2023',
    q:'Which data structure is used internally by Binary Search algorithm?',
    opts:['Stack','Queue','Array','Linked List'],
    ans:2,
    exp:'Binary Search needs <strong>random access</strong> — jumping directly to index middle = (low+high)/2. This is only possible in an <strong>Array</strong>. Linked List doesn\'t support index-based access, so Binary Search doesn\'t work on it directly.'
  },
  {
    id:8, cat:'search', year:'2025',
    q:'In Hashing, a collision occurs when:',
    opts:['Two keys map to same index','Array is full','Key is negative','Search fails'],
    ans:0,
    exp:'Imagine two students are assigned the same locker number — that\'s a collision! In hashing, when two different keys produce the <strong>same hash value (index)</strong>, they "collide". This is handled by chaining or open addressing.'
  },

  // ── SORTING (Q9–Q18) ──
  {
    id:9, cat:'sorting', year:'2022',
    q:'Which sorting algorithm is best suited for nearly sorted data?',
    opts:['Quick Sort','Merge Sort','Insertion Sort','Heap Sort'],
    ans:2,
    exp:'<strong>Insertion Sort</strong> is like arranging playing cards in hand. If cards are mostly sorted, you barely need to move them. Its best case is O(n) for nearly sorted data — making it perfect for this situation!'
  },
  {
    id:10, cat:'sorting', year:'2023',
    q:'What is the worst-case time complexity of Quick Sort?',
    opts:['O(n log n)','O(n²)','O(log n)','O(n)'],
    ans:1,
    exp:'Quick Sort\'s worst case is <strong>O(n²)</strong> — it happens when the pivot is always the smallest or largest element (like a sorted array if you pick the first element as pivot). On average it\'s O(n log n), which is why it\'s popular.'
  },
  {
    id:11, cat:'sorting', year:'2022',
    q:'Merge Sort always has time complexity:',
    opts:['O(n²)','O(n log n)','O(n)','O(log n)'],
    ans:1,
    exp:'<strong>Merge Sort</strong> divides the array in half (log n levels) and merges each level (n work). So it\'s always <strong>O(n log n)</strong> in all cases — best, average, and worst. It never has a bad day, unlike Quick Sort!'
  },
  {
    id:12, cat:'sorting', year:'2024',
    q:'Which sorting algorithm is NOT a comparison-based sort?',
    opts:['Merge Sort','Quick Sort','Counting Sort','Heap Sort'],
    ans:2,
    exp:'<strong>Counting Sort</strong> doesn\'t compare elements! It counts how many times each value appears and places them in order directly. That\'s why it can be O(n+k) — faster than comparison sorts\' O(n log n) lower bound.'
  },
  {
    id:13, cat:'sorting', year:'2023',
    q:'Which sorting algorithm is stable?',
    opts:['Quick Sort','Heap Sort','Merge Sort','Selection Sort'],
    ans:2,
    exp:'A <strong>stable sort</strong> keeps equal elements in their original order. Think of sorting students by marks — stable sort keeps same-mark students in original roll number order. <strong>Merge Sort</strong> is stable. Quick Sort and Heap Sort are generally NOT stable.'
  },
  {
    id:14, cat:'sorting', year:'2025',
    q:'What is the space complexity of Merge Sort?',
    opts:['O(1)','O(log n)','O(n)','O(n²)'],
    ans:2,
    exp:'Merge Sort needs an extra temporary array to merge two halves. This extra space is proportional to n, so space complexity is <strong>O(n)</strong>. This is a disadvantage vs Quick Sort which uses only O(log n) stack space.'
  },
  {
    id:15, cat:'sorting', year:'2022',
    q:'Bubble Sort compares:',
    opts:['Non-adjacent elements','Adjacent elements','Random elements','Sorted elements only'],
    ans:1,
    exp:'<strong>Bubble Sort</strong> compares two neighbours side-by-side and swaps if they\'re in wrong order. Like bubbles rising in water — larger values "bubble up" to the end. It compares <strong>adjacent (neighboring) elements</strong>.'
  },
  {
    id:16, cat:'sorting', year:'2024',
    q:'The minimum number of comparisons to sort n elements using Insertion Sort (best case) is:',
    opts:['O(n²)','O(n log n)','O(n)','O(1)'],
    ans:2,
    exp:'If the array is already sorted, Insertion Sort just checks each element once with its left neighbor and confirms "yes, it\'s already in place." That\'s n-1 checks → <strong>O(n)</strong>. Best case!'
  },
  {
    id:17, cat:'sorting', year:'2025',
    q:'Which sort divides array into sorted and unsorted halves, repeatedly picking minimum from unsorted?',
    opts:['Bubble Sort','Selection Sort','Insertion Sort','Shell Sort'],
    ans:1,
    exp:'<strong>Selection Sort</strong> scans the whole unsorted part, SELECTS the minimum, and puts it at the beginning. Like picking the shortest person from a crowd and moving them to the front. Repeat until all placed.'
  },
  {
    id:18, cat:'sorting', year:'2023',
    q:'Radix Sort sorts numbers by:',
    opts:['Comparing whole numbers','Processing digit by digit','Counting occurrences','Using a pivot'],
    ans:1,
    exp:'<strong>Radix Sort</strong> sorts number by digit! First sort by units digit, then tens, then hundreds. Like sorting roll numbers: first by last digit, then second last, etc. It processes <strong>digit by digit</strong> from least significant to most.'
  },

  // ── STACK (Q19–Q25) ──
  {
    id:19, cat:'stack', year:'2022',
    q:'Stack follows which principle?',
    opts:['FIFO','LIFO','FILO only','Random Access'],
    ans:1,
    exp:'Stack is like a pile of plates. You always add on top and remove from top. The LAST plate placed is the FIRST one removed — that\'s <strong>LIFO: Last In First Out</strong>. (FIFO is for Queue — like a line at a shop.)'
  },
  {
    id:20, cat:'stack', year:'2023',
    q:'Which operation removes the top element from a stack?',
    opts:['Push','Pop','Peek','IsEmpty'],
    ans:1,
    exp:'<strong>Pop</strong> removes (and returns) the top element of the stack. <strong>Push</strong> adds an element on top. <strong>Peek</strong> just looks at the top without removing. Think: Push = put plate on pile, Pop = take plate off pile!'
  },
  {
    id:21, cat:'stack', year:'2022',
    q:'Infix expression A+B*C is converted to postfix as:',
    opts:['AB+C*','ABC*+','A+BC*','ABC+*'],
    ans:1,
    exp:'Operator precedence: * before +. So B*C is done first → BC*. Then +A → <strong>ABC*+</strong>. In postfix, operator comes AFTER its operands. Computers prefer postfix because no brackets needed and easy to evaluate with a stack!'
  },
  {
    id:22, cat:'stack', year:'2024',
    q:'Stack overflow occurs when:',
    opts:['Stack is empty and we pop','Stack is full and we push','Stack has one element','Stack is sorted'],
    ans:1,
    exp:'<strong>Overflow</strong> = too much! If the stack is already full (like a full plate pile) and you try to add MORE (push), it overflows. <strong>Underflow</strong> is the opposite — popping from an empty stack.'
  },
  {
    id:23, cat:'stack', year:'2025',
    q:'Which application uses a Stack?',
    opts:['CPU Scheduling','Undo operation in editors','Print spooling','Breadth First Search'],
    ans:1,
    exp:'<strong>Undo</strong> in text editors uses a stack! Every action you do is pushed on the stack. When you press Ctrl+Z, the last action is popped and reversed. Stack\'s LIFO is perfect — undo the LAST thing you did!'
  },
  {
    id:24, cat:'stack', year:'2023',
    q:'Evaluate postfix expression: 5 3 2 * +:',
    opts:['25','11','16','10'],
    ans:1,
    exp:'Scan left to right: Push 5, Push 3, Push 2. See *: pop 2 and 3, compute 3*2=6, push 6. See +: pop 6 and 5, compute 5+6=<strong>11</strong>, push 11. Final answer: 11!'
  },
  {
    id:25, cat:'stack', year:'2024',
    q:'Which data structure is used to implement Recursion?',
    opts:['Queue','Stack','Array','Tree'],
    ans:1,
    exp:'Every time a function calls itself, the current function\'s state (variables, return address) is saved on the <strong>Call Stack</strong>. When the recursive call finishes, the saved state is popped and execution resumes. Recursion = Stack in disguise!'
  },

  // ── QUEUE (Q26–Q32) ──
  {
    id:26, cat:'queue', year:'2022',
    q:'Queue follows which principle?',
    opts:['LIFO','FIFO','Random','LILO only'],
    ans:1,
    exp:'Queue is like a line at a movie ticket counter. First person in line gets the ticket first — <strong>FIFO: First In First Out</strong>. The first element added (enqueue) is the first one removed (dequeue). Fair and orderly!'
  },
  {

let scoreCorrect = 0, scoreWrong = 0, scoreTotal = 0;
const answered = {};

function getTagClass(cat) {
  const map = { search:'tag-search', sorting:'tag-sorting', stack:'tag-stack', queue:'tag-queue', linked:'tag-linked', tree:'tag-tree', graph:'tag-graph' };
  return map[cat] || 'tag-search';
}
function getTagLabel(cat) {
  const map = { search:'Searching', sorting:'Sorting', stack:'Stack', queue:'Queue', linked:'Linked List', tree:'Tree', graph:'Graph' };
  return map[cat] || cat;
}

function renderQuestions(list) {
  const container = document.getElementById('mcq-container');
  container.innerHTML = '';
  list.forEach((q, i) => {
    const optHtml = q.opts.map((o, idx) => `
      <button class="option-btn" id="opt-${q.id}-${idx}" onclick="choose(${q.id},${idx})" ${answered[q.id]!==undefined?'disabled':''}>
        <span class="opt-label">${String.fromCharCode(65+idx)}.</span> ${o}
      </button>
    `).join('');

    const isAnswered = answered[q.id] !== undefined;
    const chosenIdx = answered[q.id];

    const card = document.createElement('div');
    card.className = 'question-card';
    card.dataset.cat = q.cat;
    card.style.animationDelay = (i * 0.04) + 's';
    card.innerHTML = `
      <div class="card-header">
        <span class="q-number">Q${q.id}</span>
        <span class="q-tag ${getTagClass(q.cat)}">${getTagLabel(q.cat)}</span>
        <span class="q-year">WBJECA ${q.year}</span>
      </div>
      <div class="q-text">${q.q}</div>
      <div class="options-grid" id="opts-${q.id}">${optHtml}</div>
      <button class="show-ans-btn" id="showbtn-${q.id}" onclick="revealAns(${q.id})">${isAnswered ? 'Hide Explanation' : '👁 Show Answer & Explanation'}</button>
      <div class="answer-box ${isAnswered?'visible':''}" id="ans-${q.id}">
        <div class="ans-header">✓ Correct Answer: ${q.opts[q.ans]}</div>
        <div class="ans-text">${q.exp}</div>
      </div>
    `;
    container.appendChild(card);

    if (isAnswered) applyStyle(q.id, chosenIdx, q.ans, false);
  });
  updateProgress();
}

function choose(qid, idx) {
  if (answered[qid] !== undefined) return;
  const q = questions.find(x => x.id === qid);
  answered[qid] = idx;
  scoreTotal++;
  if (idx === q.ans) scoreCorrect++;
  else scoreWrong++;

  applyStyle(qid, idx, q.ans, true);
  document.getElementById('score-correct').textContent = scoreCorrect;
  document.getElementById('score-wrong').textContent = scoreWrong;
  document.getElementById('score-total').textContent = scoreTotal;
  updateProgress();

  // auto show explanation
  setTimeout(() => revealAns(qid, true), 300);
}

function applyStyle(qid, chosen, correct, animate) {
  const q = questions.find(x => x.id === qid);
  q.opts.forEach((_, idx) => {
    const btn = document.getElementById(`opt-${qid}-${idx}`);
    if (!btn) return;
    btn.disabled = true;
    if (idx === correct && idx === chosen) btn.classList.add('correct-ans');
    else if (idx === chosen && chosen !== correct) btn.classList.add('wrong-ans');
    else if (idx === correct) btn.classList.add('show-correct');
  });
}

function revealAns(qid, auto=false) {
  const box = document.getElementById(`ans-${qid}`);
  const btn = document.getElementById(`showbtn-${qid}`);
  if (!box) return;
  const visible = box.classList.toggle('visible');
  btn.textContent = visible ? 'Hide Explanation' : '👁 Show Answer & Explanation';
}

function filterQ(cat, el) {
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  el.classList.add('active');
  const list = cat === 'all' ? questions : questions.filter(q => q.cat === cat);
  renderQuestions(list);
}

function resetAll() {
  Object.keys(answered).forEach(k => delete answered[k]);
  scoreCorrect = 0; scoreWrong = 0; scoreTotal = 0;
  document.getElementById('score-correct').textContent = 0;
  document.getElementById('score-wrong').textContent = 0;
  document.getElementById('score-total').textContent = 0;
  renderQuestions(questions);
}

function updateProgress() {
  const pct = (scoreTotal / 50) * 100;
  document.getElementById('progress-fill').style.width = pct + '%';
}

renderQuestions(questions);
</script>
